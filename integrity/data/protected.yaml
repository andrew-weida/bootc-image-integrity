# What derived images must leave exactly as the base image ships it.
# This is an example for a hardened RHEL bootc base. Add your security agent's package
# (or paths, if it is not an RPM) and adjust the rest to match your hardening.
integrity:
  # Fail images whose layers don't start with the base's layers (squashed, rechunked, or
  # built FROM another base digest).
  require_layered: true

  # `package_changes` reports every RPM whose version differs from the base's, and every RPM
  # the base has that the image doesn't. It warns by default; set it to `fail` if application
  # teams must not update ANY system packages.
  package_changes: warn

  # Every file the base installs from these RPMs must be identical in derived images.
  # Include the libraries your agents load: replacing a shared library is as effective
  # as replacing the agent binary.
  protected_packages:
    - audit
    - audit-libs
    - crypto-policies
    - openssh-server
    - pam
    - selinux-policy-targeted
    - sudo
    # - <your-security-agent>

  # These RPMs must not be installed in derived images
  forbidden_packages:
    - telnet
    - telnet-server

  # Individual paths to files that must be identical in derived images. If a file listed here does not exist in the base, it must stay absent in the derived image.
  protected_files:
    - /etc/ld.so.preload                  # preloads a library into every process
    - /etc/sysctl.conf                    # read as /etc/sysctl.d/99-sysctl.conf
    - /etc/rsyslog.conf                   # includes /etc/rsyslog.d/ ahead of its own rules
    - /etc/systemd/system.conf            # DefaultEnvironment= applies to every service
    - /etc/containers/policy.json
    - /etc/selinux/config                 # SELINUX=permissive disables enforcement
    - /etc/environment                    # pam_env sets these variables for every login
    - /usr/lib/ostree/prepare-root.conf   # composefs / transient /etc settings
    - /etc/ostree/prepare-root.conf       # overrides the /usr/lib file via the initramfs

  # Nothing may be added, changed or removed under these directories. 
  # If a directory listed does not exist in the base, it must stay absent in the derived image.
  sealed_dirs:
    - /etc/audit/rules.d/
    - /etc/containers/registries.d/
    - /etc/crypto-policies/
    - /etc/ld.so.conf.d/
    - /etc/pam.d/
    - /etc/pki/containers/
    - /etc/ssh/sshd_config.d/
    - /etc/sysctl.d/
    - /etc/sudoers.d/
    - /etc/systemd/system.conf.d/         # same settings as system.conf
    - /usr/lib/systemd/system.conf.d/
    - /usr/local/lib/systemd/system.conf.d/
    - /etc/systemd/system-generators/     # run as root early in boot; can override any unit
    - /usr/lib/systemd/system-generators/
    - /usr/local/lib/systemd/system-generators/
    - /etc/systemd/system-environment-generators/   # set the environment of every service
    - /usr/lib/systemd/system-environment-generators/
    - /usr/local/lib/systemd/system-environment-generators/
    - /usr/lib/bootc/kargs.d/
    - /usr/lib/modules/                   # kernel, initramfs and kernel modules
    - /var/roothome/.config/containers/   # root's policy.json overrides /etc
    # Application teams may ask for these. Each has a safer alternative in the
    # application's own unit file.
    - /etc/tmpfiles.d/          # can create or overwrite any file at boot; use StateDirectory=, LogsDirectory=
    - /etc/sysusers.d/          # can create a UID 0 user; use DynamicUser=
    - /etc/security/limits.d/   # applies to logins, not services; use LimitNOFILE= in the unit
    - /etc/modprobe.d/          # changes how kernel modules load
    # Quadlet .container files start any image as root, with any options, including
    # --privileged; the images need not be signed. This also blocks teams from shipping
    # quadlets in the OS image. Move these to appendable_dirs or add exceptions if they must.
    # A plain service unit running `podman run` still works, so this is not a boundary.
    - /etc/containers/systemd/          # also covers /etc/containers/systemd/users/
    - /usr/share/containers/systemd/
    # Packages ship the same kinds of files under /usr/lib. Uncomment to block that too;
    # installing such a package then needs an exception.
    # - /usr/lib/tmpfiles.d/
    # - /usr/lib/sysusers.d/
    # - /usr/lib/modprobe.d/
    # Not listed on purpose: /etc/profile.d/ affects only login shells, and teams often set
    # JAVA_HOME there.

  # Derived images may add files here only under names that cannot override the base.
  # Files the base already ships in these directories are protected. List only directories
  # application teams need to add to; seal the rest.
  appendable_dirs:
    # rsyslog runs these files in name order, before the rules in rsyslog.conf, and any rule
    # can discard a message. Keep the base's forwarding in 00-49 (e.g. 10-siem.conf) so
    # application files run after it.
    - dir: /etc/rsyslog.d/
      allow: '^[5-9][0-9]-[A-Za-z0-9_.-]+\.conf$'

  # A protected file under a key is overridden by the same name under each listed directory.
  shadows:
    /usr/lib/sysctl.d/: [/etc/sysctl.d/]
    /usr/lib/tmpfiles.d/: [/etc/tmpfiles.d/]
    /usr/lib/sysusers.d/: [/etc/sysusers.d/]
    /usr/lib/modprobe.d/: [/etc/modprobe.d/]
    /usr/lib/modules-load.d/: [/etc/modules-load.d/]
    /usr/lib/systemd/system-preset/: [/etc/systemd/system-preset/]
    /usr/bin/: [/usr/local/bin/, /usr/local/sbin/]
    /usr/sbin/: [/usr/local/bin/, /usr/local/sbin/]
